name: Extracao Midia Kit Mensal

# Agendamento: Roda no dia 1º de todo mês às 04:00 da manhã (Horário de Brasília)
on:
  schedule:
    - cron: '0 7 1 * *' 
  # Permite que você clique em um botão para testar agora mesmo
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas
      run: |
        pip install -r requirements.txt

    - name: Rodar o script de extração
      env:
        META_TOKEN: ${{ secrets.META_TOKEN }}
        IG_ID: ${{ secrets.IG_ID }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
      run: |
        python main.py

    - name: Enviar JSON para o repositório do Site
      uses: dmnemec/copy_file_to_another_repo_action@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.PAT_TOKEN }}
      with:
        source_file: 'dados_midia_kit.json'
        destination_repo: 'SEU_USUARIO_AQUI/casa_curadoria_art' # ⚠️ MUDE PARA O SEU USUÁRIO DO GITHUB
        destination_folder: '/'
        user_email: 'casacuradorias@gmail.com'
        user_name: 'CasaCuradoria-Bot'
        commit_message: '🤖 Auto-update: Métricas mensais do Mídia Kit atualizadas'
